pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    repositories {
        // Until com.grafana.faro.android-symbols is on the Gradle Plugin Portal, publish the
        // plugin to mavenLocal first (see Mobiles/android/README.md — "Local Gradle plugin").
        mavenLocal()
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'QuickPizza'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
