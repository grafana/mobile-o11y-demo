name: Dependency Review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          # Allow only Apache-2.0 compatible licenses (Apache Category A)
          # Based on https://www.apache.org/legal/resolved.html
          allow-licenses: >-
            Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD,
            BlueOak-1.0.0, Unlicense, CC0-1.0,
            CC-BY-4.0,
            Artistic-2.0

          # GitHub's dependency graph reports pub packages' licenses as the
          # lowercase licensee key ("apache-2.0") rather than the SPDX id
          # ("Apache-2.0"), so allow-licenses above cannot match and the run
          # fails with "could not detect the validity of all licenses".
          # faro is first-party Grafana, Apache-2.0 per its LICENSE file.
          # Drop this once the graph returns SPDX ids for pub.
          allow-dependencies-licenses: pkg:pub/faro
