name: All Foundation Tests Workflow
on: [push]

permissions:
  contents: read

jobs:
  k6_foundation_tests:
    name: k6 test run - running all foundations tests
    runs-on: ubuntu-latest
    env:
      # Use system Chrome — bundled Chromium often SIGTRAP / D-Bus failures on GHA (xk6-browser e2e).
      K6_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      # Chrome 146+ on GHA: avoid crashpad on missing cpufreq sysfs (puppeteer#14742).
      # k6 splits K6_BROWSER_ARGS on commas; value must be a single disable-features=… token.
      K6_BROWSER_ARGS: "no-sandbox,disable-dev-shm-usage,disable-features=PartitionAllocSchedulerLoopQuarantineTaskControlledPurge"
      # Avoid "Failed to connect to the bus" from Chromium on headless runners.
      DBUS_SESSION_BUS_ADDRESS: /dev/null

    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:0.15.21@sha256:de839571c65ce9ac6e96290f44a7122869f31744d93bd235903ecb9429158d32 # zizmor: ignore[unpinned-images]
        ports:
          - 3333:3333

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify runner Chrome
        run: |
          # Hosted Ubuntu runners include Chrome; avoid reinstalling it from apt.
          test -x "$K6_BROWSER_EXECUTABLE_PATH"
          "$K6_BROWSER_EXECUTABLE_PATH" --version

      - name: Setup k6
        uses: grafana/setup-k6-action@ffe7d7290dfa715e48c2ccc924d068444c94bde2 # v1
        with:
          browser: false # Use runner Chrome and preserve K6_BROWSER_ARGS.
      - name: Run k6 test
        uses: grafana/run-k6-action@a15e2072ede004e8d46141e33d7f7dad8ad08d9d # v1
        with:
          path: |
            ./k6/foundations/*.js
            ./k6/foundations/*.ts
            ./k6/internal/*.js
